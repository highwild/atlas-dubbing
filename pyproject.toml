[project]
name = "ytdub"
version = "0.3.0"
description = "Local voice-cloning dubbing pipeline: exact-duration dubbed audio tracks for YouTube."
readme = "README.md"
# Pinned to the deployment target. Chatterbox, torch 2.6 and faster-whisper/ctranslate2
# are resolved and locked (uv.lock) for exactly this version; don't widen it without
# re-locking and re-testing on the target box.
requires-python = "==3.11.*"
license = { text = "MIT" }

# Core: everything the pure stages (fitting, prompts, cache, SRT) need. Light enough to
# run the unit tests anywhere, with no GPU, models or ffmpeg.
dependencies = [
    "numpy>=1.24",              # chatterbox-tts caps this at <2 on Python < 3.13
    "scipy>=1.11",              # HiGHS LP solver for timeline fitting; polyphase resampling
    "soundfile>=0.12.1",
    "loguru>=0.7.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# The model stack for real runs (Linux + NVIDIA). Every model and library here permits
# commercial use: faster-whisper (MIT) + Whisper weights (MIT), Chatterbox (MIT),
# Resemblyzer (Apache-2.0), yt-dlp (Unlicense). Translation is Qwen3 via Ollama
# (Apache-2.0), which is a separate install. NLLB (CC-BY-NC) and XTTS (CPML,
# non-commercial) were removed for that reason.
ml = [
    "faster-whisper>=1.1.0",
    # Chatterbox hard-pins torch/torchaudio 2.6.0, transformers 5.2.0 and diffusers
    # 0.29.0 (as of 0.1.7). It is sensitive to both: pin chatterbox itself exactly and
    # restate its pins here so a resolver never "upgrades" around them. Change all of
    # these together, and only after a real synthesis test.
    "chatterbox-tts==0.1.7",
    "transformers==5.2.0",
    "diffusers==0.29.0",
    # perth (Chatterbox's watermarker) imports pkg_resources, removed in setuptools 81.
    # Without it perth silently sets its watermarker to None and every TTS call fails
    # with "'NoneType' object is not callable". The TTS backend also checks this at
    # import time and names the cause.
    "setuptools<80",
    "resemblyzer>=0.1.4",       # token-free diarization
    "yt-dlp>=2025.11.12",       # needs js_runtimes/remote_components for YouTube's JS challenge
]
# Optional, more accurate diarization. Needs a Hugging Face token + terms acceptance.
pyannote = ["pyannote.audio>=3.3"]
# Optional vocal isolation for when only a full mix exists (a clean stem is better).
separate = ["demucs>=4.0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dub = "ytdub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
